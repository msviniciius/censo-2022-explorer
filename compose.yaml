name: census-explorer

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      CENSUS_DATABASE_PATH: /data/censo.sqlite
    volumes:
      - type: bind
        source: ./censo.sqlite
        target: /data/censo.sqlite
        read_only: true
        bind:
          create_host_path: false
      - app-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "/usr/local/bin/check-census.php"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    ports:
      - "8080:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: backend-test

  dataset-audit:
    profiles: ["audit"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: backend-test
    environment:
      CENSUS_AUDIT_DATABASE: /data/censo.sqlite
    volumes:
      - type: bind
        source: ./censo.sqlite
        target: /data/censo.sqlite
        read_only: true
        bind:
          create_host_path: false
    command: ["php", "vendor/bin/pest", "--configuration", "phpunit.dataset.xml"]

  frontend-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: frontend-test

volumes:
  app-storage:
